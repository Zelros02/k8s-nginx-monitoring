apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: default
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log notice;
    pid        /var/run/nginx.pid;

    events {
      worker_connections  1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile      on;
      keepalive_timeout  65;

      # ---- Public site on port 80 ----
      server {
        listen       80;
        server_name  _;

        location / {
          root   /usr/share/nginx/html;
          index  index.html;
        }
      }

      # ---- Metrics endpoint on port 8080 ----
      server {
        listen       8080;
        server_name  _;

        location /metrics {
          stub_status;
          access_log off;
        }

        location / {
          return 404;
        }
      }
    }
